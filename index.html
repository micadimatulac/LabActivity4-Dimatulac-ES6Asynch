<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONPlaceholder Posts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>JSONPlaceholder Posts</h1>
            <p>Live data fetched using the Fetch API and ES6+</p>
        </header>

        <div class="controls">
            <input
                type="text"
                id="searchInput"
                placeholder="Search posts..."
            >

            <button id="loadPosts">Load Posts</button>
        </div>

        <div class="results-bar">
            <div id="status" class="status">
                Click "Load Posts" button to fetch data from JSONPlaceholder API.
            </div>

            <select id="sortSelect">
                <option value="default">Sort posts</option>
                <option value="titleAsc">Alphabetical (A–Z)</option>
                <option value="titleDesc">Alphabetical (Z–A)</option>
                <option value="idAsc">Post Number (Ascending)</option>
                <option value="idDesc">Post Number (Descending)</option>
            </select>
        </div>

        <div id="postsContainer" class="posts-container"></div>

        <div id="pagination" class="pagination"></div>

    </div>

    <script src="app.js"></script>
</body>
</html>
